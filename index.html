<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Attendance Register</h1>
      <p>Record and manage student attendance</p>
    </header>

    <section class="form-section">
      <input type="text" id="studentName" placeholder="Enter student name">
      <button id="addBtn">Add Student</button>
    </section>

    <section class="search-section">
      <input type="text" id="searchInput" placeholder="Search student name...">
    </section>

    <section class="summary">
      <div class="card">
        <span>Total Students</span>
        <strong id="totalStudents">0</strong>
      </div>
      <div class="card present">
        <span>Total Present</span>
        <strong id="totalPresent">0</strong>
      </div>
      <div class="card absent">
        <span>Total Absent</span>
        <strong id="totalAbsent">0</strong>
      </div>
    </section>

    <section class="table-section">
      <table>
        <thead>
          <tr>
            <th>S/N</th>
            <th>Student Name</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="attendanceTable"></tbody>
      </table>
      <p id="emptyMessage" class="empty">No students added yet.</p>
    </section>

    <div class="buttons">
      <button id="saveBtn" class="save">Save Attendance</button>
      <button id="clearBtn" class="clear">Clear All</button>
    </div>

    <p id="message" class="message"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
